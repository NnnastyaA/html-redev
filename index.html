<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel ='stylesheet' href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container-cards">
            <div class="card card-first">
                <img class="card__img " src="card-first.png" alt="gray-background">
                <p class="card__text">Ignacio Lang</p>
                <hr class="card__line">
                <div class="icons-block">
                    <img class="icon" src="Icon-fb.png" alt="facebook">
                    <img class="icon" src="Icon-twitter.png" alt="twitter">
                    <img class="icon" src="Icon-linkedin.png" alt="linkedin">
                    <img class="icon" src="Icon-instagram.png" alt="instagram">
                </div>               
            </div>

            <div class="card">
                <img class="card__img" src="background-second.jpg" alt="color-background">
                <p class="card__text">David Miller</p>
                <hr class="card__line">
            </div>
            <div class="card">
                <img class="card__img" src="background-third.png" alt="gray-background">
                <p class="card__text">Sarah Johnson</p>
                <hr class="card__line">
            </div>            
        </div>
    </body>
</html>
