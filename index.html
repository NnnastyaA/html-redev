<body>
    <form class="form">
        <div class="form__group">
            <label class="form__label" for="nameSurname">Имя и Фамилия</label>
            <input id="nameSurname" class="form__input" type="text" placeholder="Александрa Иванова" />
        </div>
        <div class="form__cost">
            <p class="form__title">показать цену</p>
            <div class="cost__groups">
                <div class="cost__group">
                    <input class="cost__radio " type="radio" id="person" name="person" />
                    <label class="cost__label" for="person">
                        <div class="cost__custom-radio"></div>
                        на человека
                    </label>
                </div>
                <div class="cost__group">
                    <input class="cost__radio " type="radio" id="people" name="person" />
                    <label class="cost__label" for="people">
                        <div class="cost__custom-radio"></div>
                        на всех
                    </label>
                </div>
            </div>
        </div>

        <div class="food__filter">
            <p class="form__title">еда</p>
