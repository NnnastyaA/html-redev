<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel ='stylesheet' href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>

        <div class="container">
            <form class="buttons">
                <h2 class="title">Buttons</h2>
                <div class="buttons-primary">
                    <h3 class="form-title">Primary/Primary</h3>
                    <button class="form-button" type="button" >Normal</button>
                </div>
                <div class="smpl-buttons">
                    <h3 class="form-title">Simple Buttons</h3>
                    <button class="smpl-button">
                        <span>Normal</span>
                        <img class="smpl-button-img" src="ArrowGreen.png">
                    </button>
                </div>
                <div class="smpl-buttons">
                    <h3 class="form-title">Simple Buttons</h3>
                    <button class="smpl-button smpl-button-red">
                        <span>Normal</span>
                        <img class="smpl-button-img" src="ArrowRed.png">
                    </button>
                </div>
            </form>

            <form class="form">
                <h2 class="title">Form elements</h2>
                <div class="form-container">
                    <h3 class="form-title">Input Field</h3>
                    <form id="form">
                        <input class="form-input" id="form" type="text" placeholder="Normal">
                    </form>
                </div>
            </form>

        </div>
    </body>
</html>
